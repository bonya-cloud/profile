<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>discoragen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0507;
    --card: rgba(18, 8, 10, 0.70);
    --card-border: rgba(255, 45, 77, 0.3);
    --red: #ff2d4d;
    --red-dim: #7a0c1f;
    --red-glow: rgba(255, 45, 77, 0.35);
    --text: #f2e6e8;
    --muted: #9c7b80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- Кастомный геймерский/кибер-курсор ---------- */
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M2 2l16 7-6 3-3 6z' fill='%23ff2d4d' stroke='%230a0507' stroke-width='1.5'/><circle cx='5' cy='5' r='1' fill='%23ffffff'/></svg>"), auto;
  }

  a, button, .play-btn, .progress-bar, .social-btn, #enterOverlay, .visitor-count {
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M2 2l16 7-6 3-3 6z' fill='%23ffffff' stroke='%23ff2d4d' stroke-width='1.5'/><circle cx='5' cy='5' r='1.5' fill='%23ff2d4d'/></svg>"), pointer;
  }

  /* ---------- Экран входа ---------- */
  #enterOverlay {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #050203;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }

  #enterOverlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .enter-ring {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 45, 77, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: enterPulse 2.2s ease-in-out infinite;
  }

  .enter-ring::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 16px var(--red-glow);
  }

  @keyframes enterPulse {
    0%, 100% { transform: scale(1); border-color: rgba(255, 45, 77, 0.35); }
    50% { transform: scale(1.12); border-color: rgba(255, 45, 77, 0.7); }
  }

  .enter-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text);
  }

  .enter-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* ---------- Фон ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(0deg, rgba(10, 5, 7, 0.3), rgba(10, 5, 7, 0.3)), url('assets/bg.gif') center/cover no-repeat;
  }

  .scanlines {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,45,77,0.02) 0px, transparent 2px);
    opacity: 0.8;
  }

  /* ---------- Карточка ---------- */
  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 380px;
    padding: 16px;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .stage.revealed {
    opacity: 1;
    transform: translateY(0);
  }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 32px 24px 28px;
    text-align: center;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }

  .avatar-wrap { position: relative; width: 92px; height: 92px; margin: 0 auto 16px; }
  .avatar-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--red), var(--red-dim), var(--red));
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar {
    width: 92px; height: 92px; border-radius: 50%;
    background: #1a0d10;
    border: 3px solid #0a0507;
    position: relative;
    z-index: 2;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .status-dot {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 14px;
    height: 14px;
    background: var(--red);
    border: 2px solid #0a0507;
    border-radius: 50%;
    z-index: 3;
  }

  .username {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
    display: inline-block;
    background: linear-gradient(
      100deg,
      var(--text) 35%,
      #fff 48%,
      #ffd7dc 52%,
      var(--text) 65%
    );
    background-size: 260% 100%;
    background-position: 200% 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: usernameShine 5s ease-in-out infinite;
  }

  @keyframes usernameShine {
    0%, 55% { background-position: 200% 0; }
    75% { background-position: -60% 0; }
    100% { background-position: -60% 0; }
  }

  .bio { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }

  .location {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .loc-icon {
    width: 14px;
    height: 14px;
    fill: var(--text);
    opacity: 0.85;
  }

  /* ---------- Теги-интересы ---------- */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-bottom: 18px;
  }

  .tag {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--red);
    background: rgba(255, 45, 77, 0.08);
    border: 1px solid rgba(255, 45, 77, 0.25);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.3px;
  }

  .social-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .social-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255, 45, 77, 0.12);
    border: 1px solid rgba(255, 45, 77, 0.4);
    color: var(--text);
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .social-btn svg {
    width: 18px;
    height: 18px;
    fill: var(--text);
    transition: fill 0.2s ease;
  }

  .social-btn:hover {
    background: var(--red);
    border-color: var(--red);
    box-shadow: 0 0 15px var(--red-glow);
    transform: translateY(-2px);
  }

  .social-btn:hover svg {
    fill: #000;
  }

  /* ---------- Счётчик просмотров ---------- */
  .visitor-count {
    position: absolute;
    bottom: 12px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: rgba(242, 230, 232, 0.7);
    transition: color 0.2s ease;
    user-select: none;
  }

  .visitor-count:hover {
    color: var(--text);
  }

  .visitor-count svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  .visitor-label {
    max-width: 0;
    opacity: 0;
    white-space: nowrap;
    overflow: hidden;
    transition: max-width 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
    font-size: 10px;
    color: var(--muted);
  }

  .visitor-count:hover .visitor-label {
    max-width: 80px;
    opacity: 1;
    margin-left: 2px;
  }

  /* ---------- Плеер ---------- */
  .player {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    backdrop-filter: blur(20px);
  }

  .track-cover {
    width: 40px; height: 40px; border-radius: 8px;
    background: #1a0d10;
    border: 1px solid var(--card-border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .track-cover img { width: 100%; height: 100%; object-fit: cover; }

  .track-info { flex: 1; min-width: 0; }
  .track-title { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .controls-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .time-text { font-size: 11px; color: var(--muted); width: 26px; text-align: center; }

  .progress-bar {
    flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative;
  }
  .progress-fill { position: absolute; height: 100%; width: 0%; background: var(--red); border-radius: 2px; }

  .volume-container { display: flex; align-items: center; }
  .volume-slider {
    width: 40px;
    height: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    cursor: pointer;
  }

  .play-btn {
    background: var(--red);
    color: #000;
    border: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s ease;
  }
  .play-btn:active { transform: scale(0.93); }
  .play-btn svg { fill: #000; width: 14px; height: 14px; }

  /* ---------- Пасхалка ---------- */
  .glitch-flash {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--red);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  .glitch-flash.active {
    animation: glitchFlash 0.4s steps(2, end);
  }

  @keyframes glitchFlash {
    0% { opacity: 0; }
    25% { opacity: 0.5; transform: translateX(-6px); }
    50% { opacity: 0.2; transform: translateX(6px); }
    75% { opacity: 0.4; transform: translateX(-3px); }
    100% { opacity: 0; transform: translateX(0); }
  }

  .secret-toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    z-index: 1001;
    background: rgba(10, 5, 7, 0.92);
    border: 1px solid var(--red);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 10px 18px;
    border-radius: 10px;
    box-shadow: 0 0 20px var(--red-glow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .secret-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 420px) {
    .stage { max-width: 92vw; }
  }
</style>
</head>
<body>

  <!-- Экран входа -->
  <div id="enterOverlay">
    <div class="enter-ring"></div>
    <div class="enter-text">click to enter</div>
    <div class="enter-sub">sound on</div>
  </div>

  <div class="backdrop"></div>
  <div class="scanlines"></div>
  <div class="glitch-flash" id="glitchFlash"></div>
  <div class="secret-toast" id="secretToast">you found me 🩸</div>

  <div class="stage" id="stage">
    <div class="card">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <img src="assets/avatar.jpg" alt="avatar">
        </div>
        <div class="status-dot"></div>
      </div>

      <h1 class="username">discoragen</h1>

      <p class="bio">
        hey, i'm discoragen. this is my little corner of the internet.<br>message me on telegram if you want.
      </p>

      <div class="location">
        <svg class="loc-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        <span>Russia, Yekaterinburg</span>
      </div>

      <div class="tags">
        <span class="tag">#python</span>
        <span class="tag">#webdev</span>
        <span class="tag">#opensource</span>
        <span class="tag">#linux</span>
        <span class="tag">#learning</span>
      </div>

      <div class="social-buttons">
        <a href="https://t.me/Discoragen" target="_blank" class="social-btn" title="Telegram">
          <svg viewBox="0 0 496 512"><path d="M248,8C111,8,0,119,0,256S111,504,248,504,496,393,496,256,385,8,248,8ZM362,169.9c-3.7,39.2-19.9,134.4-28.1,178.3-3.5,18.6-10.3,24.8-16.9,25.4-14.4,1.3-25.3-9.5-39.3-18.7-21.8-14.3-34.2-23.2-55.3-37.2-24.5-16.1-8.6-25,5.3-39.5,3.7-3.8,67.1-61.5,68.3-66.7.2-.7.3-3.1-1.2-4.4s-3.6-.8-5.1-.5q-3.3.7-104.6,69.1-14.8,10.2-26.9,9.9c-8.9-.2-25.9-5-38.6-9.1-15.5-5-27.9-7.7-26.8-16.3q.8-6.7,18.5-13.7,108.4-47.2,144.6-62.3c68.9-28.6,83.2-33.6,92.5-33.8,2.1,0,6.6.5,9.6,2.9a10.5,10.5,0,0,1,3.5,6.7A43.8,43.8,0,0,1,362,169.9Z"/></svg>
        </a>
        <a href="https://github.com/bonya-cloud" target="_blank" class="social-btn" title="GitHub">
          <svg viewBox="0 0 24 24"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.7-1.4-1.7-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.2 1.9 1.2 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6a4.7 4.7 0 0 1 1.2-3.2 4.3 4.3 0 0 1 .1-3.2s1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2a4.3 4.3 0 0 1 .1 3.2 4.7 4.7 0 0 1 1.2 3.2c0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3z"/></svg>
        </a>
      </div>

      <!-- Просмотры с глазиком -->
      <div class="visitor-count">
        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        <span id="visitorCount">35</span>
        <span class="visitor-label">views</span>
      </div>
    </div>

    <!-- Плеер -->
    <div class="player">
      <div class="track-cover">
        <img src="assets/cover.jpg" alt="cover">
      </div>

      <div class="track-info">
        <div class="track-title">discoragen — track</div>

        <div class="controls-row">
          <span class="time-text" id="currentTime">0:00</span>

          <div class="progress-bar" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <span class="time-text" id="duration">0:00</span>

          <div class="volume-container">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
          </div>
        </div>
      </div>

      <button class="play-btn" id="playBtn" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" src="assets/track.mp3" preload="metadata" loop></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const enterOverlay = document.getElementById('enterOverlay');
    const stage = document.getElementById('stage');

    audio.volume = 0.8;

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    enterOverlay.addEventListener('click', () => {
      enterOverlay.classList.add('hidden');
      stage.classList.add('revealed');

      audio.play().then(() => {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      }).catch(() => {});
    }, { once: true });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        }).catch(err => console.error(err));
      } else {
        audio.pause();
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    });

    audio.addEventListener('timeupdate', () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    progressTrack.addEventListener('click', e => {
      if (!audio.duration) return;
      const rect = progressTrack.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    volumeSlider.addEventListener('input', e => {
      audio.volume = e.target.value;
    });

    /* ---------- Логика счётчика просмотров ---------- */
    (function () {
      const el = document.getElementById('visitorCount');
      let count = parseInt(localStorage.getItem('discoragen_visits'), 10);
      if (!count || isNaN(count)) {
        count = 35;
      } else {
        count += 1;
      }
      localStorage.setItem('discoragen_visits', count);
      el.textContent = count;
    })();

    /* ---------- Пасхалка ---------- */
    (function () {
      const secretWord = 'discoragen';
      let buffer = '';
      const flash = document.getElementById('glitchFlash');
      const toast = document.getElementById('secretToast');
      let toastTimeout;

      window.addEventListener('keydown', (e) => {
        if (e.key.length !== 1) return;
        buffer = (buffer + e.key.toLowerCase()).slice(-secretWord.length);
        if (buffer === secretWord) {
          flash.classList.remove('active');
          void flash.offsetWidth;
          flash.classList.add('active');

          toast.classList.add('show');
          clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => toast.classList.remove('show'), 2600);

          buffer = '';
        }
      });
    })();
  </script>
</body>
</html>
