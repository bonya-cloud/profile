<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>discoragen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0507;
    --bg-deep: #050203;
    --card: rgba(18, 8, 10, 0.65);
    --card-border: rgba(255, 45, 77, 0.2);
    --red: #ff2d4d;
    --red-dim: #7a0c1f;
    --red-glow: rgba(255, 45, 77, 0.35);
    --text: #f2e6e8;
    --muted: #9c7b80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  body { 
    background: var(--bg); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
  }

  .backdrop, .scanlines, .noise-pulse { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .backdrop { background: radial-gradient(circle at 50% 50%, rgba(122,12,31,0.4) 0%, transparent 70%), linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%); }
  .scanlines { background: repeating-linear-gradient(0deg, rgba(255,45,77,0.02) 0px, transparent 2px); opacity: 0.8; z-index: 1; }
  .noise-pulse { background: radial-gradient(circle at 50% 40%, rgba(255,45,77,0.05), transparent 60%); animation: pulse 6s infinite; z-index: 1; }

  @keyframes pulse { 0%,100% {opacity:0.3} 50% {opacity:0.8} }

  .stage { position: relative; z-index: 2; width: 100%; max-width: 380px; padding: 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 32px 24px 24px;
    text-align: center;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .avatar-wrap { position: relative; width: 92px; height: 92px; margin: 0 auto 16px; }
  .avatar-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--red), var(--red-dim), var(--red));
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar {
    width: 92px; height: 92px; border-radius: 50%;
    background: #1a0d10;
    border: 3px solid var(--bg-deep);
    position: relative;
    z-index: 2;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .status-dot {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 14px;
    height: 14px;
    background: var(--red);
    border: 2px solid var(--bg-deep);
    border-radius: 50%;
    z-index: 3;
  }

  .username { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; }

  .bio { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }

  .location { font-size: 12px; color: var(--muted); margin-bottom: 18px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .flag { font-size: 11px; font-weight: 600; opacity: 0.8; }

  /* Блок кнопок соцсетей */
  .social-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .social-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(255, 45, 77, 0.12);
    border: 1px solid rgba(255, 45, 77, 0.35);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
    flex: 1;
    min-width: 120px;
  }

  .social-btn:hover { 
    background: var(--red); 
    color: #000; 
    box-shadow: 0 0 15px var(--red-glow); 
  }

  .social-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  /* Плеер */
  .player {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    backdrop-filter: blur(16px);
  }

  .track-cover {
    width: 40px; height: 40px; border-radius: 8px;
    background: #1a0d10;
    border: 1px solid var(--card-border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .track-cover img { width: 100%; height: 100%; object-fit: cover; }

  .track-info { flex: 1; min-width: 0; }
  .track-title { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .controls-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .time-text { font-size: 11px; color: var(--muted); width: 26px; text-align: center; }

  .progress-bar {
    flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; position: relative;
  }
  .progress-fill { position: absolute; height: 100%; width: 0%; background: var(--red); border-radius: 2px; }

  /* Громкость */
  .volume-container { display: flex; align-items: center; }
  .volume-slider {
    width: 40px;
    height: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    cursor: pointer;
  }

  .play-btn {
    background: var(--red);
    color: #000;
    border: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s ease;
  }
  .play-btn:active { transform: scale(0.93); }
  .play-btn svg { fill: #000; width: 14px; height: 14px; }
</style>
</head>
<body>

  <div class="backdrop"></div>
  <div class="scanlines"></div>
  <div class="noise-pulse"></div>

  <div class="stage">
    <div class="card">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <img src="assets/avatar.jpg" alt="avatar">
        </div>
        <div class="status-dot"></div>
      </div>
      
      <h1 class="username">discoragen</h1>
      
      <p class="bio">
        hey, i'm discoragen. this is my little corner of the internet.<br>message me on telegram if you want.
      </p>

      <div class="location">
        <span class="flag">RU</span> Russia, Yekaterinburg
      </div>

      <!-- Кнопки перехода -->
      <div class="social-buttons">
        <a href="https://t.me/Discoragen" target="_blank" class="social-btn">
          Telegram
        </a>
        <a href="https://github.com/bonya-cloud" target="_blank" class="social-btn">
          GitHub
        </a>
      </div>
    </div>

    <div class="player">
      <div class="track-cover">
        <img src="assets/avatar.jpg" alt="cover">
      </div>
      
      <div class="track-info">
        <div class="track-title">discoragen — track</div>
        
        <div class="controls-row">
          <span class="time-text" id="currentTime">0:00</span>
          
          <div class="progress-bar" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          
          <span class="time-text" id="duration">0:00</span>

          <div class="volume-container">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
          </div>
        </div>
      </div>

      <button class="play-btn" id="playBtn" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" src="assets/track.mp3" preload="metadata" loop></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        }).catch(err => {
          console.error("Ошибка аудио:", err);
        });
      } else {
        audio.pause();
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    });

    audio.addEventListener('timeupdate', () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    progressTrack.addEventListener('click', e => {
      if (!audio.duration) return;
      const rect = progressTrack.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    volumeSlider.addEventListener('input', e => {
      audio.volume = e.target.value;
    });
  </script>
</body>
</html>
