<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>discoragen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0507;
    --bg-deep: #050203;
    --card: rgba(18, 8, 10, 0.55);
    --card-border: rgba(255, 45, 77, 0.25);
    --red: #ff2d4d;
    --red-dim: #7a0c1f;
    --red-glow: rgba(255, 45, 77, 0.45);
    --text: #f2e6e8;
    --muted: #9c7b80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  body {
    position: relative;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Фоновый слой: тёмный градиент + мягкое красное свечение снизу */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 50% 110%, rgba(122, 12, 31, 0.55) 0%, transparent 55%),
      radial-gradient(ellipse at 15% -10%, rgba(255, 45, 77, 0.18) 0%, transparent 45%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%);
  }

  /* Если хочешь своё фоновое фото — раскомментируй background-image ниже
     и положи файл assets/background.jpg рядом с index.html */
  .backdrop.with-image {
    background-image:
      linear-gradient(180deg, rgba(5,2,3,0.75) 0%, rgba(5,2,3,0.92) 100%),
      url('assets/background.jpg');
    background-size: cover;
    background-position: center;
    filter: saturate(1.1);
  }

  /* Тонкие сканлайны поверх фона — сигнатурный элемент страницы */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(255, 45, 77, 0.03) 0px,
      rgba(255, 45, 77, 0.03) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity: 0.6;
  }

  .noise-pulse {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at 50% 40%, rgba(255,45,77,0.06), transparent 60%);
    animation: pulse 6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  .sound-toggle {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 10;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(20, 8, 10, 0.6);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .sound-toggle:hover { border-color: var(--red); transform: scale(1.05); }
  .sound-toggle svg { width: 18px; height: 18px; stroke: var(--text); }

  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
  }

  .card {
    position: relative;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    padding: 32px 28px 22px;
    text-align: center;
    box-shadow: 0 0 60px -20px var(--red-glow), inset 0 1px 0 rgba(255,255,255,0.04);
    animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar-wrap {
    position: relative;
    width: 92px;
    height: 92px;
    margin: 0 auto 18px;
  }

  .avatar-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--red), var(--red-dim), var(--red));
    animation: spin 5s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .avatar {
    position: relative;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    overflow: hidden;
    background: #1a0d10 url('assets/avatar.jpg') center/cover no-repeat;
    border: 3px solid var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--red);
  }

  .status-dot {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--red);
    border: 3px solid var(--bg);
    box-shadow: 0 0 8px var(--red-glow);
  }

  .username {
    position: relative;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
    text-shadow: 0 0 18px var(--red-glow);
  }

  /* Глитч-эффект на нике — сигнатурная деталь страницы */
  .username::before,
  .username::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    opacity: 0;
  }
  .username::before {
    color: var(--red);
    animation: glitch-1 4.5s infinite;
    clip-path: inset(0 0 0 0);
  }
  .username::after {
    color: #4dd0ff;
    animation: glitch-2 4.5s infinite;
  }

  @keyframes glitch-1 {
    0%, 92%, 100% { opacity: 0; transform: translate(0); }
    93% { opacity: 0.8; transform: translate(-2px, 1px); }
    95% { opacity: 0.8; transform: translate(2px, -1px); }
    97% { opacity: 0; }
  }
  @keyframes glitch-2 {
    0%, 92%, 100% { opacity: 0; transform: translate(0); }
    93% { opacity: 0.6; transform: translate(2px, -1px); }
    95% { opacity: 0.6; transform: translate(-2px, 1px); }
    97% { opacity: 0; }
  }

  .bio {
    margin-top: 12px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--muted);
    font-weight: 400;
  }

  .meta-row {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .meta-row svg { width: 13px; height: 13px; stroke: var(--muted); }

  .links {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .link-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(255, 45, 77, 0.08);
    border: 1px solid var(--card-border);
    color: var(--text);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 500;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .link-pill:hover {
    background: rgba(255, 45, 77, 0.16);
    border-color: var(--red);
  }
  .link-pill svg { width: 13px; height: 13px; stroke: var(--red); }

  .divider {
    margin: 20px auto 0;
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--card-border), transparent);
  }

  .footprint {
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .footprint svg { width: 12px; height: 12px; stroke: var(--muted); }

  /* Плеер */
  .player {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: rise 0.6s 0.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  .track-cover {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    background: #1a0d10 url('assets/cover.jpg') center/cover no-repeat;
    flex-shrink: 0;
    border: 1px solid var(--card-border);
  }

  .track-info {
    flex: 1;
    min-width: 0;
  }

  .track-title {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
  }

  .track-time {
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 28px;
  }

  .progress-track {
    flex: 1;
    height: 3px;
    border-radius: 3px;
    background: rgba(255,255,255,0.1);
    position: relative;
    cursor: pointer;
  }

  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    border-radius: 3px;
    background: var(--red);
    box-shadow: 0 0 8px var(--red-glow);
  }

  .player-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .ctrl-btn {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text);
    opacity: 0.75;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .ctrl-btn:hover { opacity: 1; transform: scale(1.08); }
  .ctrl-btn svg { width: 15px; height: 15px; }

  .play-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--red);
    opacity: 1;
  }
  .play-btn svg { width: 14px; height: 14px; fill: #0a0507; stroke: none; }
  .play-btn:hover { transform: scale(1.06); box-shadow: 0 0 14px var(--red-glow); }

  @media (max-width: 420px) {
    .stage { max-width: 92vw; }
  }
</style>
</head>
<body>

  <div class="backdrop"></div>
  <div class="scanlines"></div>
  <div class="noise-pulse"></div>

  <div class="sound-toggle" id="soundToggle" title="Звук">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path id="soundWave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
  </div>

  <div class="stage">

    <div class="card">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">D</div>
        <div class="status-dot"></div>
      </div>

      <h1 class="username" data-text="discoragen">discoragen</h1>

      <p class="bio">
        hey, i'm discoragen. this is my little corner of the internet.<br>
        message me on telegram if you want.
      </p>

      <div class="meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span>Russia, Yekaterinburg</span>
      </div>

      <div class="links">
        <a class="link-pill" href="https://t.me/Discoragen" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2 11 13"></path>
            <path d="M22 2 15 22l-4-9-9-4 20-7z"></path>
          </svg>
          @Discoragen
        </a>
      </div>

      <div class="divider"></div>

      <div class="footprint">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span id="viewCount">— viewing this page</span>
      </div>
    </div>

    <div class="player">
      <div class="track-cover"></div>
      <div class="track-info">
        <div class="track-title" id="trackTitle">track name — artist</div>
        <div class="track-progress-row">
          <span class="track-time" id="currentTime">0:00</span>
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="track-time" id="duration">0:00</span>
        </div>
      </div>
      <div class="player-controls">
        <button class="ctrl-btn" id="restartBtn" title="С начала">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5"></line>
          </svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
        </button>
      </div>
    </div>

  </div>

  <audio id="audio" src="assets/track.mp3" preload="metadata" loop></audio>

  <script>
    // ---------- Плеер ----------
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const restartBtn = document.getElementById('restartBtn');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const soundToggle = document.getElementById('soundToggle');

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function setPlayingIcon(isPlaying) {
      playIcon.innerHTML = isPlaying
        ? '<rect x="5" y="3" width="4" height="18"></rect><rect x="15" y="3" width="4" height="18"></rect>'
        : '<polygon points="6 3 20 12 6 21 6 3"></polygon>';
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(() => {});
        setPlayingIcon(true);
      } else {
        audio.pause();
        setPlayingIcon(false);
      }
    });

    restartBtn.addEventListener('click', () => {
      audio.currentTime = 0;
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
      const pct = (audio.currentTime / audio.duration) * 100 || 0;
      progressFill.style.width = pct + '%';
    });

    progressTrack.addEventListener('click', (e) => {
      const rect = progressTrack.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      audio.currentTime = ratio * audio.duration;
    });

    // Значок звука сверху слева — просто mute/unmute
    let muted = false;
    soundToggle.addEventListener('click', () => {
      muted = !muted;
      audio.muted = muted;
      document.getElementById('soundWave').style.opacity = muted ? '0.25' : '1';
    });

    // Небольшая деталь: имитация "просмотров" страницы (визуальная, без реального счётчика)
    document.getElementById('viewCount').textContent =
      Math.floor(Math.random() * 40 + 10) + ' viewing this page';
  </script>

</body>
</html>
