<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>discoragen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0507;
    --bg-deep: #050203;
    --card: rgba(18, 8, 10, 0.55);
    --card-border: rgba(255, 45, 77, 0.25);
    --red: #ff2d4d;
    --red-dim: #7a0c1f;
    --red-glow: rgba(255, 45, 77, 0.45);
    --text: #f2e6e8;
    --muted: #9c7b80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  body { background: var(--bg); display: flex; align-items: center; justify-content: center; position: relative; }

  .backdrop, .scanlines, .noise-pulse { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .backdrop { background: radial-gradient(ellipse at 50% 110%, rgba(122,12,31,0.55) 0%, transparent 55%), linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%); }

  .scanlines { background: repeating-linear-gradient(0deg, rgba(255,45,77,0.03) 0px, transparent 3px); opacity: 0.6; z-index: 1; }

  .noise-pulse { background: radial-gradient(circle at 50% 40%, rgba(255,45,77,0.06), transparent 60%); animation: pulse 6s infinite; z-index: 1; }

  @keyframes pulse { 0%,100% {opacity:0.4} 50% {opacity:0.9} }

  .stage { position: relative; z-index: 2; max-width: 380px; padding: 20px; width: 100%; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 32px 28px 22px;
    text-align: center;
    backdrop-filter: blur(18px);
  }

  .avatar-wrap { position: relative; width: 92px; height: 92px; margin: 0 auto 18px; }
  .avatar-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--red), var(--red-dim), var(--red));
    animation: spin 5s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar {
    width: 92px; height: 92px; border-radius: 50%;
    background: #1a0d10;
    border: 3px solid var(--bg);
    overflow: hidden;
    position: relative;
    z-index: 2;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .username { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 8px; }

  .player {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }

  .track-cover {
    width: 42px; height: 42px; border-radius: 8px;
    background: #1a0d10;
    border: 1px solid var(--card-border);
    overflow: hidden;
  }
  .track-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .track-title { font-weight: 500; font-size: 13px; }
</style>
</head>
<body>

  <div class="backdrop"></div>
  <div class="scanlines"></div>
  <div class="noise-pulse"></div>

  <div class="stage">
    <div class="card">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <img src="assets/avatar.jpg" alt="avatar">
        </div>
      </div>
      <h1 class="username">discoragen</h1>
      <p>hey, i'm discoragen. this is my little corner of the internet.<br>message me on telegram if you want.</p>
      <p style="margin-top:12px; font-size:13px; color:var(--muted);">Russia, Yekaterinburg</p>
    </div>

    <div class="player">
      <div class="track-cover">
        <img src="assets/avatar.jpg" alt="track cover">
      </div>
      <div style="flex:1">
        <div class="track-title" id="trackTitle">discoragen — track</div>
        <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
          <span id="currentTime">0:00</span>
          <div id="progressTrack" style="flex:1; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; cursor:pointer; position:relative;">
            <div id="progressFill" style="position:absolute; height:100%; width:0%; background:var(--red); border-radius:2px;"></div>
          </div>
          <span id="duration">0:00</span>
        </div>
      </div>
      <button id="playBtn" style="background:var(--red); color:#000; border:none; width:36px; height:36px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:bold;">▶</button>
    </div>
  </div>

  <audio id="audio" src="assets/track.mp3" preload="metadata" loop></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = id => document.getElementById('playBtn'); // поправлено для надежности
    const realPlayBtn = document.getElementById('playBtn');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    realPlayBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(e => {
          console.error("Ошибка воспроизведения аудио:", e);
          alert("Не удалось воспроизвести трек. Проверьте, загружен ли файл assets/track.mp3 в репозиторий.");
        });
        realPlayBtn.textContent = '❚❚';
      } else {
        audio.pause();
        realPlayBtn.textContent = '▶';
      }
    });

    audio.addEventListener('timeupdate', () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
      if(audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    progressTrack.addEventListener('click', e => {
      if(!audio.duration) return;
      const rect = progressTrack.getBoundingClientRect();
      audio.currentTime = (e.clientX - rect.left) / rect.width * audio.duration;
    });
  </script>
</body>
</html>
