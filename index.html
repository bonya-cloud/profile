<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>discoragen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0507;
    --card: rgba(18, 8, 10, 0.70);
    --card-border: rgba(255, 45, 77, 0.3);
    --red: #ff2d4d;
    --red-dim: #7a0c1f;
    --red-glow: rgba(255, 45, 77, 0.35);
    --text: #f2e6e8;
    --muted: #9c7b80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- Кастомный курсор: красный прицел в тон сайту ---------- */
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><circle cx='14' cy='14' r='5' fill='none' stroke='%23ff2d4d' stroke-width='1.6'/><circle cx='14' cy='14' r='1.4' fill='%23ff2d4d'/><line x1='14' y1='0' x2='14' y2='7' stroke='%23ff2d4d' stroke-width='1.4'/><line x1='14' y1='21' x2='14' y2='28' stroke='%23ff2d4d' stroke-width='1.4'/><line x1='0' y1='14' x2='7' y2='14' stroke='%23ff2d4d' stroke-width='1.4'/><line x1='21' y1='14' x2='28' y2='14' stroke='%23ff2d4d' stroke-width='1.4'/></svg>") 14 14, auto;
  }

  a, button, .play-btn, .progress-bar, .social-btn, #enterOverlay {
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'><circle cx='15' cy='15' r='6' fill='%23ff2d4d' fill-opacity='0.25' stroke='%23ff2d4d' stroke-width='1.8'/><circle cx='15' cy='15' r='2' fill='%23ff2d4d'/></svg>") 15 15, pointer;
  }

  /* ---------- Экран входа ---------- */
  #enterOverlay {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #050203;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }

  #enterOverlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .enter-ring {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 45, 77, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: enterPulse 2.2s ease-in-out infinite;
  }

  .enter-ring::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 16px var(--red-glow);
  }

  @keyframes enterPulse {
    0%, 100% { transform: scale(1); border-color: rgba(255, 45, 77, 0.35); }
    50% { transform: scale(1.12); border-color: rgba(255, 45, 77, 0.7); }
  }

  .enter-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text);
  }

  .enter-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* ---------- Фон ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(0deg, rgba(10, 5, 7, 0.3), rgba(10, 5, 7, 0.3)), url('assets/bg.gif') center/cover no-repeat;
  }

  .scanlines {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,45,77,0.02) 0px, transparent 2px);
    opacity: 0.8;
  }

  /* ---------- Карточка (скрыта до входа) ---------- */
  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 380px;
    padding: 16px;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .stage.revealed {
    opacity: 1;
    transform: translateY(0);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 32px 24px 24px;
    text-align: center;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }

  .avatar-wrap { position: relative; width: 92px; height: 92px; margin: 0 auto 16px; }
  .avatar-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--red), var(--red-dim), var(--red));
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar {
    width: 92px; height: 92px; border-radius: 50%;
    background: #1a0d10;
    border: 3px solid #0a0507;
    position: relative;
    z-index: 2;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .status-dot {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 14px;
    height: 14px;
    background: var(--red);
    border: 2px solid #0a0507;
    border-radius: 50%;
    z-index: 3;
  }

  .username { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; }

  .bio { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }

  .location { font-size: 12px; color: var(--muted); margin-bottom: 18px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .flag { font-size: 11px; font-weight: 600; opacity: 0.8; }

  .social-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .social-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(255, 45, 77, 0.15);
    border: 1px solid rgba(255, 45, 77, 0.4);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
    flex: 1;
    min-width: 120px;
  }

  .social-btn:hover {
    background: var(--red);
    color: #000;
    box-shadow: 0 0 15px var(--red-glow);
  }

  /* Плеер */
  .player {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    backdrop-filter: blur(20px);
  }

  .track-cover {
    width: 40px; height: 40px; border-radius: 8px;
    background: #1a0d10;
    border: 1px solid var(--card-border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .track-cover img { width: 100%; height: 100%; object-fit: cover; }

  .track-info { flex: 1; min-width: 0; }
  .track-title { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .controls-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .time-text { font-size: 11px; color: var(--muted); width: 26px; text-align: center; }

  .progress-bar {
    flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative;
  }
  .progress-fill { position: absolute; height: 100%; width: 0%; background: var(--red); border-radius: 2px; }

  .volume-container { display: flex; align-items: center; }
  .volume-slider {
    width: 40px;
    height: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    cursor: pointer;
  }

  .play-btn {
    background: var(--red);
    color: #000;
    border: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s ease;
  }
  .play-btn:active { transform: scale(0.93); }
  .play-btn svg { fill: #000; width: 14px; height: 14px; }
</style>
</head>
<body>

  <!-- Экран входа: клик запускает музыку и открывает карточку -->
  <div id="enterOverlay">
    <div class="enter-ring"></div>
    <div class="enter-text">click to enter</div>
    <div class="enter-sub">sound on</div>
  </div>

  <div class="backdrop"></div>
  <div class="scanlines"></div>

  <div class="stage" id="stage">
    <div class="card">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <img src="assets/avatar.jpg" alt="avatar">
        </div>
        <div class="status-dot"></div>
      </div>

      <h1 class="username">discoragen</h1>

      <p class="bio">
        hey, i'm discoragen. this is my little corner of the internet.<br>message me on telegram if you want.
      </p>

      <div class="location">
        <span class="flag">RU</span> Russia, Yekaterinburg
      </div>

      <div class="social-buttons">
        <a href="https://t.me/Discoragen" target="_blank" class="social-btn">Telegram</a>
        <a href="https://github.com/bonya-cloud" target="_blank" class="social-btn">GitHub</a>
      </div>
    </div>

    <div class="player">
      <div class="track-cover">
        <img src="assets/avatar.jpg" alt="cover">
      </div>

      <div class="track-info">
        <div class="track-title">discoragen — track</div>

        <div class="controls-row">
          <span class="time-text" id="currentTime">0:00</span>

          <div class="progress-bar" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <span class="time-text" id="duration">0:00</span>

          <div class="volume-container">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
          </div>
        </div>
      </div>

      <button class="play-btn" id="playBtn" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" src="assets/track.mp3" preload="metadata" loop></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const enterOverlay = document.getElementById('enterOverlay');
    const stage = document.getElementById('stage');

    audio.volume = 0.8;

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // Клик по экрану входа: запускаем звук (это единственный надёжный момент,
    // когда браузер разрешает автоплей) и показываем карточку
    enterOverlay.addEventListener('click', () => {
      enterOverlay.classList.add('hidden');
      stage.classList.add('revealed');

      audio.play().then(() => {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      }).catch(() => {
        // если всё же не удалось — просто оставляем на паузе, кнопка сработает вручную
      });
    }, { once: true });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        }).catch(err => console.error(err));
      } else {
        audio.pause();
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    });

    audio.addEventListener('timeupdate', () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    progressTrack.addEventListener('click', e => {
      if (!audio.duration) return;
      const rect = progressTrack.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    volumeSlider.addEventListener('input', e => {
      audio.volume = e.target.value;
    });
  </script>
</body>
</html>
