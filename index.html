<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@discoragen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #0a0507;
    --card: rgba(18, 8, 10, 0.70);
    --card-border: rgba(255, 45, 77, 0.3);
    --red: #ff2d4d;
    --red-dim: #7a0c1f;
    --red-glow: rgba(255, 45, 77, 0.35);
    --text: #f2e6e8;
    --muted: #9c7b80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow-x: hidden;
    overflow-y: auto;
  }

  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--red-dim);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--red);
  }

  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M2 2l16 7-6 3-3 6z' fill='%23ff2d4d' stroke='%230a0507' stroke-width='1.5'/><circle cx='5' cy='5' r='1' fill='%23ffffff'/></svg>"), auto;
  }

  a, button, .play-btn, .progress-slider, .social-btn, .tag, .volume-slider, #enterOverlay, .visitor-count, .fullscreen-btn, .username, .game-plaque, .corner-volume, .location, .gb-send-btn, .reaction-btn, .gb-delete-btn, .picker-emoji-opt, .admin-login-btn, .admin-logout-btn, .admin-banner-btn {
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M2 2l16 7-6 3-3 6z' fill='%23ffffff' stroke='%23ff2d4d' stroke-width='1.5'/><circle cx='5' cy='5' r='1.5' fill='%23ff2d4d'/></svg>"), pointer;
  }

  .fullscreen-btn {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 100;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(20px);
    transition: all 0.2s ease;
    outline: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .fullscreen-btn:hover {
    background: var(--red);
    border-color: var(--red);
    box-shadow: 0 0 15px var(--red-glow);
    transform: scale(1.05);
  }

  .fullscreen-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: var(--text);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.2s ease;
  }

  .fullscreen-btn:hover svg {
    stroke: #000;
  }

  .main-container {
    max-width: 900px;
    width: 100%;
    z-index: 50;
  }

  /* --- ПРОФИЛЬ --- */
  .profile-section {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    margin-bottom: 20px;
  }

  .profile-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .profile-info { flex: 1; }

  .profile-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--red), #ff7700, var(--red));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    flex-shrink: 0;
    box-shadow: 0 0 20px var(--red-glow);
  }

  .username {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--red), #ff7700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .user-status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 10px #10b981;
    transition: all 0.3s ease;
  }
  .status-dot.offline { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
  .status-text { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .user-location { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

  .social-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .social-btn {
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid var(--card-border);
    background: rgba(255, 45, 77, 0.08);
    color: var(--text);
    text-decoration: none;
    font-size: 12px;
    transition: all 0.2s ease;
  }
  .social-btn:hover {
    background: var(--red);
    border-color: var(--red);
    transform: translateY(-2px);
    box-shadow: 0 0 15px var(--red-glow);
  }

  /* --- АКТИВНОСТЬ --- */
  .activity-section {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .activity-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 16px;
    text-align: center;
    backdrop-filter: blur(20px);
  }

  .activity-value { font-size: 24px; font-weight: 700; color: var(--red); margin-bottom: 4px; }
  .activity-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  /* --- ИГРЫ --- */
  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
  }

  .games-section {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    margin-bottom: 20px;
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  .game-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 45, 77, 0.15);
    border-radius: 6px;
    padding: 12px;
    transition: all 0.2s ease;
  }
  .game-card:hover {
    background: rgba(255, 45, 77, 0.08);
    border-color: rgba(255, 45, 77, 0.3);
  }
  .game-img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
  .game-info { display: flex; flex-direction: column; gap: 4px; }
  .game-name { font-weight: 600; font-size: 14px; color: var(--text); }
  .game-genre { font-size: 11px; color: var(--muted); }

  /* --- ПЛАШКА АДМИНКИ --- */
  .admin-banner-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, rgba(255, 45, 77, 0.1) 0%, rgba(255, 119, 0, 0.1) 100%);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 16px 24px;
    margin-bottom: 20px;
    text-align: left;
    transition: all 0.3s ease;
    backdrop-filter: blur(20px);
    outline: none;
  }

  .admin-banner-btn:hover {
    background: linear-gradient(90deg, rgba(255, 45, 77, 0.2) 0%, rgba(255, 119, 0, 0.2) 100%);
    border-color: var(--red);
    box-shadow: 0 0 20px rgba(255, 45, 77, 0.2);
    transform: translateY(-2px);
  }

  .admin-banner-btn.is-admin-active {
    background: linear-gradient(90deg, rgba(255, 234, 0, 0.1) 0%, rgba(255, 119, 0, 0.1) 100%);
    border-color: rgba(255, 234, 0, 0.4);
  }

  .admin-banner-btn.is-admin-active:hover {
    background: linear-gradient(90deg, rgba(255, 234, 0, 0.2) 0%, rgba(255, 119, 0, 0.2) 100%);
    box-shadow: 0 0 20px rgba(255, 234, 0, 0.2);
  }

  .admin-banner-content { display: flex; align-items: center; gap: 16px; }
  .admin-banner-icon { font-size: 28px; }
  .admin-banner-text { display: flex; flex-direction: column; gap: 2px; }
  .admin-banner-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); }
  .admin-banner-btn.is-admin-active .admin-banner-title { color: #ffea00; }
  .admin-banner-sub { font-size: 12px; color: var(--muted); }
  .admin-banner-arrow { font-size: 20px; color: var(--red); font-weight: bold; transition: transform 0.3s ease; }
  .admin-banner-btn.is-admin-active .admin-banner-arrow { color: #ffea00; }
  .admin-banner-btn:hover .admin-banner-arrow { transform: translateX(5px); }

  /* --- ГОСТЕВАЯ КНИГА --- */
  .guestbook-section {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .gb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .gb-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: var(--text); }
  
  .gb-input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  #gbInput {
    flex: 1; padding: 10px 12px; background: rgba(255, 45, 77, 0.08); border: 1px solid var(--card-border);
    border-radius: 4px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; outline: none; transition: all 0.2s ease;
  }
  #gbInput:focus { border-color: var(--red); box-shadow: 0 0 10px var(--red-glow); }
  
  .gb-send-btn {
    padding: 10px 16px; background: var(--red); border: 1px solid var(--red); border-radius: 4px; color: #000;
    font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .gb-send-btn:hover { background: #ff7700; border-color: #ff7700; box-shadow: 0 0 15px rgba(255, 119, 0, 0.5); }

  #gbMessages { display: flex; flex-direction: column; gap: 12px; max-height: 500px; overflow-y: auto; padding-right: 8px; }
  .gb-msg {
    display: flex; gap: 12px; padding: 12px; background: rgba(255, 45, 77, 0.05);
    border: 1px solid rgba(255, 45, 77, 0.15); border-radius: 6px; transition: all 0.2s ease;
  }
  .gb-msg.admin-post-style { background: rgba(255, 234, 0, 0.05); border: 1px solid rgba(255, 234, 0, 0.3); }
  .gb-msg.admin-post-style .gb-avatar { background: conic-gradient(from 0deg, #ffea00, #ff7700); color: #000; box-shadow: 0 0 10px rgba(255, 234, 0, 0.4); }
  .gb-msg.admin-post-style .gb-author { color: #ffea00; text-shadow: 0 0 8px rgba(255, 234, 0, 0.4); }

  .admin-badge {
    background: #ffea00; color: #000; font-size: 10px; font-weight: 800; padding: 2px 6px;
    border-radius: 4px; margin-left: 6px; box-shadow: 0 0 10px rgba(255, 234, 0, 0.4); display: inline-block;
  }

  .gb-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: conic-gradient(from 0deg, var(--red), #ff7700);
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: #000; flex-shrink: 0;
  }
  .gb-content { flex: 1; min-width: 0; }
  .gb-user-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .gb-author { font-weight: 600; color: var(--red); font-size: 13px; }
  .gb-time { font-size: 11px; color: var(--muted); }
  .gb-delete-btn { margin-left: auto; padding: 4px 8px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 3px; color: #ef4444; font-size: 11px; transition: all 0.2s ease; }
  .gb-delete-btn:hover { background: rgba(239, 68, 68, 0.4); border-color: #ef4444; }
  .gb-text { color: var(--text); font-size: 13px; margin-bottom: 8px; word-wrap: break-word; }

  /* Реакции */
  .gb-reactions { display: flex; gap: 4px; flex-wrap: wrap; }
  .reaction-btn { padding: 4px 8px; background: rgba(255, 45, 77, 0.15); border: 1px solid rgba(255, 45, 77, 0.3); border-radius: 3px; color: var(--text); font-size: 12px; cursor: pointer; transition: all 0.2s ease; }
  .reaction-btn:hover { background: rgba(255, 45, 77, 0.3); border-color: var(--red); }
  .reaction-btn span { margin-left: 4px; font-size: 10px; color: var(--muted); }

  .emoji-picker-container { position: relative; }
  .emoji-picker-popup {
    position: absolute; bottom: 100%; left: 0; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 6px; padding: 6px; display: flex; gap: 4px; flex-wrap: wrap; width: 150px; max-height: 0; opacity: 0; overflow: hidden; transition: all 0.2s ease; pointer-events: none; margin-bottom: 4px;
  }
  .emoji-picker-popup.show { max-height: 200px; opacity: 1; pointer-events: auto; }
  .picker-emoji-opt { width: 28px; height: 28px; background: rgba(255, 45, 77, 0.15); border: 1px solid rgba(255, 45, 77, 0.3); border-radius: 3px; font-size: 14px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
  .picker-emoji-opt:hover { background: rgba(255, 45, 77, 0.3); transform: scale(1.1); }

  /* --- МОДАЛЬНОЕ ОКНО --- */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; padding: 32px; max-width: 320px; width: 90%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
  .modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
  .modal-input { width: 100%; padding: 10px 12px; background: rgba(255, 45, 77, 0.08); border: 1px solid var(--card-border); border-radius: 4px; color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; transition: all 0.2s ease; }
  .modal-input:focus { border-color: var(--red); box-shadow: 0 0 10px var(--red-glow); }
  .modal-buttons { display: flex; gap: 8px; }
  .modal-btn { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid var(--card-border); background: rgba(255, 45, 77, 0.12); color: var(--text); font-weight: 500; cursor: pointer; transition: all 0.2s ease; }
  .modal-btn:hover { background: var(--red); border-color: var(--red); box-shadow: 0 0 10px var(--red-glow); }
  .modal-btn-cancel { background: rgba(100, 100, 100, 0.2); }
  .modal-btn-cancel:hover { background: rgba(100, 100, 100, 0.4); border-color: var(--muted); }

  .error-toast {
    position: fixed; bottom: 20px; left: 20px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 4px; padding: 12px 16px; color: #ef4444; font-size: 12px; opacity: 0; transform: translateY(20px); pointer-events: none; transition: all 0.3s ease; z-index: 1001;
  }
  .error-toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

  @media (max-width: 600px) {
    body { padding: 20px 12px; }
    .profile-header { flex-direction: column; align-items: center; text-align: center; }
    .social-links { justify-content: center; }
    .activity-section { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div id="adminLoginModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">🔐 Вход в админ-панель</div>

  const coolinessLevel = document.getElementById('coolinessLevel');
  
  const adminBannerBtn = document.getElementById('adminBannerBtn');

  const gbMessagesContainer = document.getElementById('gbMessages');
  const gbInput = document.getElementById('gbInput');
  const gbSendBtn = document.getElementById('gbSendBtn');

  // ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ПЛАШКИ АДМИНА
  function updateAdminUI() {
    if (isAdmin) {
      coolinessLevel.textContent = '∞';
      adminBannerBtn.classList.add('is-admin-active');
      adminBannerIcon.textContent = '👑';
      adminBannerTitle.textContent = 'Вы вошли как Администратор';
      adminBannerSub.textContent = 'Нажмите сюда, чтобы выйти из админ-панели';
      adminBannerBtn.onclick = logoutAdmin;
    } else {
      coolinessLevel.textContent = '100';
      adminBannerBtn.classList.remove('is-admin-active');
      adminBannerIcon.textContent = '🔐';
      adminBannerTitle.textContent = 'Вход в Админ-панель';
      adminBannerSub.textContent = 'Управление профилем и модерация гостевой книги';
      adminBannerBtn.onclick = openAdminModal;
    }
    renderGuestbook();
  }

  // ПРОВЕРКА СОХРАНЕННОЙ СЕССИИ
  if (localStorage.getItem('discoragen_admin') === 'true') {
    isAdmin = true;
    updateAdminUI();
  }

  window.openAdminModal = () => { adminLoginModal.classList.add('show'); adminPassword.focus(); };
  window.closeAdminModal = () => { adminLoginModal.classList.remove('show'); adminPassword.value = ''; };

  window.submitAdminLogin = function() {
    if (adminPassword.value === ADMIN_PASSWORD) {
      isAdmin = true;
      localStorage.setItem('discoragen_admin', 'true');
      closeAdminModal();
      updateAdminUI();
      showToast('Добро пожаловать, администратор! 👑');
    } else {
      showToast('❌ Неверный пароль!');
      adminPassword.value = '';
    }
  };

  window.logoutAdmin = function() {
    isAdmin = false;
    localStorage.removeItem('discoragen_admin');
    updateAdminUI();
    showToast('Вы вышли из админ-панели');
  };

  function showToast(message) {
    errorToast.textContent = message;
    errorToast.classList.add('show');
    setTimeout(() => errorToast.classList.remove('show'), 3000);
  }

  // СЛУШАЕМ БАЗУ ДАННЫХ В РЕАЛЬНОМ ВРЕМЕНИ
  db.collection('messages').onSnapshot((snapshot) => {
    currentMessagesList = [];
    snapshot.forEach(doc => {
      currentMessagesList.push({ id: doc.id, ...doc.data() });
    });
    // Сортировка по времени создания
    currentMessagesList.sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
    renderGuestbook();
  });

  // ОТРИСОВКА СООБЩЕНИЙ ГОСТЕВОЙ КНИГИ
  function renderGuestbook() {
    gbMessagesContainer.innerHTML = '';
    currentMessagesList.forEach((msg) => {
      const msgDiv = document.createElement('div');
      
      const isAdminPost = msg.isAdminPost === true;
      msgDiv.className = isAdminPost ? 'gb-msg admin-post-style' : 'gb-msg';

      let reactionsHTML = '';
      if (msg.reactions) {
        for (const [emoji, count] of Object.entries(msg.reactions)) {
          reactionsHTML += `<button class="reaction-btn" onclick="handleReaction('${msg.id}', '${emoji}')">${emoji} <span>${count}</span></button>`;
        }
      }

      const deleteButtonHTML = isAdmin ? `<button class="gb-delete-btn" onclick="deleteMessage('${msg.id}')" title="Удалить сообщение">🗑️ Удалить</button>` : '';
      const adminBadgeHTML = isAdminPost ? `<span class="admin-badge">👑 ADMIN</span>` : '';
      const avatarContent = isAdminPost ? '👑' : (msg.author || 'A')[0].toUpperCase();

      msgDiv.innerHTML = `
        <div class="gb-avatar">${avatarContent}</div>
        <div class="gb-content">
          <div class="gb-user-row">
            <span class="gb-author">${escapeHtml(msg.author)}</span>
            ${adminBadgeHTML}
            <span class="gb-time">${msg.time}</span>
            ${deleteButtonHTML}
          </div>
          <div class="gb-text">${escapeHtml(msg.text)}</div>
          <div class="gb-reactions">
            ${reactionsHTML}
            <div class="emoji-picker-container">
              <button class="reaction-btn" onclick="togglePicker('${msg.id}')">➕</button>
              <div class="emoji-picker-popup" id="picker-${msg.id}">
                <button class="picker-emoji-opt" onclick="handleReaction('${msg.id}', '👍')">👍</button>
                <button class="picker-emoji-opt" onclick="handleReaction('${msg.id}', '❤️')">❤️</button>
                <button class="picker-emoji-opt" onclick="handleReaction('${msg.id}', '🔥')">🔥</button>
                <button class="picker-emoji-opt" onclick="handleReaction('${msg.id}', '💀')">💀</button>
                <button class="picker-emoji-opt" onclick="handleReaction('${msg.id}', '🚀')">🚀</button>
                <button class="picker-emoji-opt" onclick="handleReaction('${msg.id}', '⭐')">⭐</button>
                <button class="picker-emoji-opt" onclick="handleReaction('${msg.id}', '💯')">💯</button>
              </div>
            </div>
          </div>
        </div>
      `;
      gbMessagesContainer.appendChild(msgDiv);
    });
    gbMessagesContainer.scrollTop = gbMessagesContainer.scrollHeight;
  }

  function escapeHtml(text) { return String(text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  window.togglePicker = function(id) {
    document.querySelectorAll('.emoji-picker-popup').forEach(p => {
      if (p.id !== `picker-${id}`) p.classList.remove('show');
    });
    const picker = document.getElementById(`picker-${id}`);
    if (picker) picker.classList.toggle('show');
  };

  // ОТПРАВКА РЕАКЦИИ
  window.handleReaction = function(id, emoji) {
    db.collection('messages').doc(id).get().then(doc => {
      if (!doc.exists) return;
      let reactions = doc.data().reactions || {};
      reactions[emoji] = (reactions[emoji] || 0) + 1;
      db.collection('messages').doc(id).update({ reactions });
    });
  };

  // УДАЛЕНИЕ СООБЩЕНИЯ (для админа)
  window.deleteMessage = function(id) {
    if (!isAdmin) {
      showToast('❌ Только администратор может удалять сообщения!');
      return;
    }
    db.collection('messages').doc(id).delete().then(() => {
        showToast('✓ Сообщение удалено');
    });
  };

  // ОТПРАВКА СООБЩЕНИЯ
  function postMessage() {
    const text = gbInput.value.trim();
    if (!text) return;

    let authorName = '';
    let isAdminPostFlag = false;

    if (isAdmin) {
      authorName = '@discoragen';
      isAdminPostFlag = true;
    } else {
      const randomNames = ['guest_99', 'cyber_user', 'anon_1337', 'player_one', 'user_52', 'visitor'];
      authorName = randomNames[Math.floor(Math.random() * randomNames.length)];
    }

    db.collection('messages').add({
      author: authorName,
      text: text,
      time: 'Только что',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      reactions: { '👍': 1 },
      isAdminPost: isAdminPostFlag
    }).then(() => {
      gbInput.value = '';
    });
  }

  gbSendBtn.addEventListener('click', postMessage);
  gbInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') postMessage(); });

  // Вспомогательные обработчики
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAdminModal(); });
  adminPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAdminLogin(); });
  adminLoginModal.addEventListener('click', (e) => { if (e.target === adminLoginModal) closeAdminModal(); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.emoji-picker-container')) {
      document.querySelectorAll('.emoji-picker-popup').forEach(p => p.classList.remove('show'));
    }
  });

  // Статус и Fullscreen
  const statusDot = document.getElementById('statusDot');
  function updateOnlineStatus() {
    if (!navigator.onLine || document.hidden) {
      statusDot.classList.add('offline'); statusDot.title = 'Статус: Не в сети';
    } else {
      statusDot.classList.remove('offline'); statusDot.title = 'Статус: В сети';
    }
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  document.addEventListener('visibilitychange', updateOnlineStatus);
  updateOnlineStatus();

  (function() {
    const fsBtn = document.getElementById('fullscreenBtn');
    const enterIcon = document.getElementById('enterFsIcon');
    const exitIcon = document.getElementById('exitFsIcon');
    function toggleFullscreen() {
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); }
      else { document.exitFullscreen(); }
    }
    function updateFsIcons() {
      const isFs = !!document.fullscreenElement;
      enterIcon.style.display = isFs ? 'none' : 'block';
      exitIcon.style.display = isFs ? 'block' : 'none';
    }
    if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFsIcons);
  })();
</script>
</body>
</html>
