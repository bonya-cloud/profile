<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@discoragen | Разработчик, Стример, Творец Контента</title>
<meta name="theme-color" content="#0a0507">

<!-- SEO Базовые теги -->
<meta name="description" content="discoragen - разработчик, стример на Twitch, создатель контента. Портфолио проектов, гостевая книга, донаты.">
<meta name="keywords" content="discoragen, разработчик, developer, стример, twitch, python, webdev, portfolio">
<meta name="author" content="discoragen">

<!-- Open Graph -->
<meta property="og:type" content="profile">
<meta property="og:title" content="@discoragen | Разработчик и Стример">
<meta property="og:description" content="Портфолио разработчика с проектами, гостевой книгой и донатами.">
<meta property="og:url" content="https://bonya-cloud.github.io/profile/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Telegram Web Apps SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root {
    /* Default Dark Theme */
    --bg: #0a0507;
    --card: rgba(18, 8, 10, 0.70);
    --card-border: rgba(255, 45, 77, 0.3);
    --red: #ff2d4d;
    --red-dim: #7a0c1f;
    --red-glow: rgba(255, 45, 77, 0.35);
    --text: #f2e6e8;
    --muted: #9c7b80;
    --accent: #ff2d4d;
  }

  /* Halloween Theme */
  body.halloween-theme {
    --bg: #1a0a0a;
    --card: rgba(30, 10, 5, 0.75);
    --card-border: rgba(255, 100, 0, 0.3);
    --red: #ff6400;
    --red-dim: #7a3000;
    --accent: #ff6400;
  }

  /* New Year Theme */
  body.newyear-theme {
    --bg: #0a1020;
    --card: rgba(8, 15, 40, 0.75);
    --card-border: rgba(0, 200, 255, 0.3);
    --red: #00c8ff;
    --red-dim: #003d5c;
    --accent: #00c8ff;
  }

  /* Birthday Theme (May 6) */
  body.birthday-theme {
    --bg: #1a0a1a;
    --card: rgba(30, 10, 30, 0.75);
    --card-border: rgba(255, 0, 150, 0.3);
    --red: #ff00ff;
    --red-dim: #7a0080;
    --accent: #ff00ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow-x: hidden;
    transition: background 0.3s ease;
  }

  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
  }

  /* ========== LANGUAGE & THEME CONTROLS ========== */
  .controls-header {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 12px;
    z-index: 10000;
  }

  .lang-toggle, .theme-toggle {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .lang-toggle:hover, .theme-toggle:hover {
    background: rgba(255, 45, 77, 0.12);
    border-color: var(--red);
    box-shadow: 0 0 15px var(--red-glow);
  }

  .lang-toggle.active, .theme-toggle.active {
    background: rgba(255, 45, 77, 0.2);
    border-color: var(--red);
  }

  /* ========== TELEGRAM LOGIN MODAL ========== */
  .telegram-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }

  .telegram-modal.active {
    display: flex;
  }

  .telegram-modal-content {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 32px;
    max-width: 420px;
    width: 90%;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: modalSlideIn 0.3s ease;
  }

  @keyframes modalSlideIn {
    from {
      opacity: 0;
      transform: translateY(-30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .telegram-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .telegram-modal-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .telegram-modal-title svg {
    width: 24px;
    height: 24px;
    fill: var(--red);
  }

  .telegram-modal-close {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 24px;
    transition: color 0.2s ease;
  }

  .telegram-modal-close:hover {
    color: var(--text);
  }

  .telegram-modal-desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 24px;
  }

  .telegram-login-btn {
    width: 100%;
    background: linear-gradient(135deg, #0088cc 0%, #005fa3 100%);
    border: none;
    border-radius: 12px;
    padding: 14px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .telegram-login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 136, 204, 0.4);
  }

  .telegram-login-btn svg {
    width: 20px;
    height: 20px;
  }

  .telegram-guest-note {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  .telegram-privacy {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--card-border);
  }

  /* ========== GUESTBOOK SECTION ========== */
  .guestbook-container {
    width: 100%;
    max-width: 800px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: blur(20px);
    margin-top: 24px;
  }

  .guestbook-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .guestbook-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
  }

  .login-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .gb-input {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s ease;
  }

  .gb-input:focus {
    outline: none;
    border-color: var(--red);
    background: rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 12px var(--red-glow);
  }

  .gb-buttons {
    display: flex;
    gap: 10px;
  }

  .gb-send-btn, .gb-telegram-btn {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .gb-telegram-btn {
    background: linear-gradient(135deg, #0088cc 0%, #005fa3 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .gb-telegram-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 136, 204, 0.3);
  }

  .gb-entries {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
  }

  .gb-entry {
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px;
    animation: entryFadeIn 0.3s ease;
  }

  @keyframes entryFadeIn {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .gb-entry-name {
    font-weight: 600;
    color: var(--red);
    font-size: 14px;
  }

  .gb-entry-text {
    color: var(--text);
    font-size: 13px;
    margin-top: 6px;
    line-height: 1.5;
  }

  .gb-entry-time {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* Scrollbar Styling */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--red-dim);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--red);
  }

  @media (max-width: 768px) {
    .telegram-modal-content {
      padding: 24px;
    }
    .gb-buttons {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<!-- Language & Theme Controls -->
<div class="controls-header">
  <button class="lang-toggle" id="langToggle">
    <span id="langIcon">🇷🇺</span>
    <span id="langText">EN</span>
  </button>
  <button class="theme-toggle" id="themeToggle">
    <span id="themeIcon">🎨</span>
    <span id="themeText" data-en="Theme" data-ru="Тема">Тема</span>
  </button>
</div>

<!-- Telegram Login Modal -->
<div class="telegram-modal" id="telegramModal">
  <div class="telegram-modal-content">
    <div class="telegram-modal-header">
      <div class="telegram-modal-title">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0c6.627 0 12 5.373 12 12s-5.373 12-12 12S0 18.627 0 12 5.373 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295-.042 0-.084 0-.126-.01l-.214-3.137 5.73-5.18c.25-.223-.054-.336-.386-.113L7.77 13.69l-3.129-.98c-.68-.215-.692-.68.143-.997l12.203-4.709c.566-.247 1.066.128.895.953z"/>
        </svg>
        <span id="modalTitle" data-en="Login via Telegram" data-ru="Вход через Telegram">Вход через Telegram</span>
      </div>
      <button class="telegram-modal-close" onclick="closeTelegramModal()">×</button>
    </div>

    <div class="telegram-modal-desc" id="modalDesc" data-en="Leave a message in the guestbook quickly and securely. Your avatar will be pulled from your Telegram profile." data-ru="Оставьте сообщение в гостевой книге быстро и безопасно. Ваш аватар будет взят из вашего профиля Telegram.">
      Оставьте сообщение в гостевой книге быстро и безопасно. Ваш аватар будет взят из вашего профиля Telegram.
    </div>

    <button class="telegram-login-btn" onclick="initTelegramAuth()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="white">
        <path d="M12 0c6.627 0 12 5.373 12 12s-5.373 12-12 12S0 18.627 0 12 5.373 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295-.042 0-.084 0-.126-.01l-.214-3.137 5.73-5.18c.25-.223-.054-.336-.386-.113L7.77 13.69l-3.129-.98c-.68-.215-.692-.68.143-.997l12.203-4.709c.566-.247 1.066.128.895.953z"/>
      </svg>
      <span id="loginBtnText" data-en="Login with Telegram" data-ru="Войти через Telegram">Войти через Telegram</span>
    </button>

    <div class="telegram-privacy" id="privacyText" data-en="We only store your name, avatar and user ID. Nothing more." data-ru="Мы храним только ваше имя, аватар и ID пользователя. Ничего больше.">
      Мы храним только ваше имя, аватар и ID пользователя. Ничего больше.
    </div>
  </div>
</div>

<!-- Guestbook Section -->
<div class="guestbook-container">
  <div class="guestbook-header">
    <div class="guestbook-title">
      <span id="gbTitle" data-en="📖 Guestbook" data-ru="📖 Гостевая книга">📖 Гостевая книга</span>
    </div>
  </div>

  <div class="login-section">
    <input type="text" class="gb-input" id="gbName" placeholder="Ваше имя..." data-en="Your name..." data-ru="Ваше имя...">
    <textarea class="gb-input" id="gbMessage" placeholder="Ваше сообщение..." rows="3" data-en="Your message..." data-ru="Ваше сообщение..."></textarea>
    <div class="gb-buttons">
      <button class="gb-send-btn" id="gbSendBtn" onclick="sendGuestbookEntry()" style="background: linear-gradient(135deg, #ff2d4d 0%, #ff1a3a 100%); color: white;">
        <span id="sendBtnText" data-en="Send" data-ru="Отправить">Отправить</span>
      </button>
      <button class="gb-telegram-btn" onclick="openTelegramModal()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="white" style="width: 18px; height: 18px;">
          <path d="M12 0c6.627 0 12 5.373 12 12s-5.373 12-12 12S0 18.627 0 12 5.373 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295-.042 0-.084 0-.126-.01l-.214-3.137 5.73-5.18c.25-.223-.054-.336-.386-.113L7.77 13.69l-3.129-.98c-.68-.215-.692-.68.143-.997l12.203-4.709c.566-.247 1.066.128.895.953z"/>
        </svg>
        <span id="telegramBtnText" data-en="Telegram" data-ru="Telegram">Telegram</span>
      </button>
    </div>
  </div>

  <div class="gb-entries" id="gbEntries"></div>
</div>

<script>
  // ========== i18n TRANSLATIONS ==========
  const translations = {
    ru: {
      "modalTitle": "Вход через Telegram",
      "modalDesc": "Оставьте сообщение в гостевой книге быстро и безопасно. Ваш аватар будет взят из вашего профиля Telegram.",
      "loginBtnText": "Войти через Telegram",
      "privacyText": "Мы храним только ваше имя, аватар и ID пользователя. Ничего больше.",
      "gbTitle": "📖 Гостевая книга",
      "sendBtnText": "Отправить",
      "telegramBtnText": "Telegram",
      "gbName": "Ваше имя...",
      "gbMessage": "Ваше сообщение...",
      "themeText": "Тема",
      "langText": "EN",
      "halloweenTheme": "🎃 Halloween",
      "newyearTheme": "🎆 Новый год",
      "birthdayTheme": "🎂 День рождения",
      "defaultTheme": "🌙 Default"
    },
    en: {
      "modalTitle": "Login via Telegram",
      "modalDesc": "Leave a message in the guestbook quickly and securely. Your avatar will be pulled from your Telegram profile.",
      "loginBtnText": "Login with Telegram",
      "privacyText": "We only store your name, avatar and user ID. Nothing more.",
      "gbTitle": "📖 Guestbook",
      "sendBtnText": "Send",
      "telegramBtnText": "Telegram",
      "gbName": "Your name...",
      "gbMessage": "Your message...",
      "themeText": "Theme",
      "langText": "РУ",
      "halloweenTheme": "🎃 Halloween",
      "newyearTheme": "🎆 New Year",
      "birthdayTheme": "🎂 Birthday",
      "defaultTheme": "🌙 Default"
    }
  };

  let currentLang = localStorage.getItem('lang') || 'ru';
  let currentTheme = localStorage.getItem('theme') || 'auto';
  let userSession = null;

  // ========== LANGUAGE SYSTEM ==========
  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('lang', lang);
    document.documentElement.lang = lang;

    // Update all data attributes
    document.querySelectorAll('[data-en][data-ru]').forEach(el => {
      el.textContent = translations[lang][el.id] || translations[lang][el.dataset.en] || el.textContent;
    });

    // Update placeholders
    document.getElementById('gbName').placeholder = translations[lang].gbName;
    document.getElementById('gbMessage').placeholder = translations[lang].gbMessage;

    // Update button text
    document.getElementById('langToggle').innerHTML = 
      `<span id="langIcon">${lang === 'ru' ? '🇷🇺' : '🇬🇧'}</span><span id="langText">${translations[lang].langText}</span>`;

    document.getElementById('langToggle').classList.toggle('active', true);
  }

  // ========== SEASONAL THEME SYSTEM ==========
  function detectCurrentTheme() {
    const today = new Date();
    const month = today.getMonth() + 1;
    const date = today.getDate();

    // Halloween: October 31
    if (month === 10 && date === 31) return 'halloween';
    // New Year: December 31 - January 1
    if ((month === 12 && date === 31) || (month === 1 && date === 1)) return 'newyear';
    // Birthday: May 6
    if (month === 5 && date === 6) return 'birthday';
    
    return 'default';
  }

  function applyTheme(theme) {
    document.body.classList.remove('halloween-theme', 'newyear-theme', 'birthday-theme');
    
    if (theme === 'halloween') {
      document.body.classList.add('halloween-theme');
    } else if (theme === 'newyear') {
      document.body.classList.add('newyear-theme');
    } else if (theme === 'birthday') {
      document.body.classList.add('birthday-theme');
    }
  }

  function initThemeSystem() {
    const autoTheme = detectCurrentTheme();
    const storedTheme = localStorage.getItem('theme');
    
    if (storedTheme === 'disabled') {
      applyTheme('default');
      currentTheme = 'disabled';
    } else if (storedTheme === 'auto' || !storedTheme) {
      applyTheme(autoTheme);
      currentTheme = 'auto';
    } else {
      applyTheme(storedTheme);
      currentTheme = storedTheme;
    }

    updateThemeButtonText();
  }

  function updateThemeButtonText() {
    const today = new Date();
    const month = today.getMonth() + 1;
    const date = today.getDate();

    let themeText = translations[currentLang].defaultTheme;
    
    if (month === 10 && date === 31) {
      themeText = translations[currentLang].halloweenTheme;
    } else if ((month === 12 && date === 31) || (month === 1 && date === 1)) {
      themeText = translations[currentLang].newyearTheme;
    } else if (month === 5 && date === 6) {
      themeText = translations[currentLang].birthdayTheme;
    }

    document.getElementById('themeText').textContent = themeText;
  }

  function toggleTheme() {
    const themes = ['auto', 'disabled'];
    const currentIndex = themes.indexOf(currentTheme);
    const nextTheme = themes[(currentIndex + 1) % themes.length];
    
    currentTheme = nextTheme;
    localStorage.setItem('theme', nextTheme);
    
    if (nextTheme === 'disabled') {
      applyTheme('default');
    } else {
      const autoTheme = detectCurrentTheme();
      applyTheme(autoTheme);
    }

    updateThemeButtonText();
  }

  // ========== TELEGRAM LOGIN ==========
  function openTelegramModal() {
    document.getElementById('telegramModal').classList.add('active');
  }

  function closeTelegramModal() {
    document.getElementById('telegramModal').classList.remove('active');
  }

  function initTelegramAuth() {
    // Check if Telegram Web App is available
    if (window.Telegram && window.Telegram.WebApp) {
      const WebApp = window.Telegram.WebApp;
      const user = WebApp.initDataUnsafe.user;

      if (user) {
        userSession = {
          id: user.id,
          first_name: user.first_name,
          last_name: user.last_name || '',
          username: user.username || '',
          photo_url: user.photo_url || '',
          timestamp: Date.now()
        };

        localStorage.setItem('userSession', JSON.stringify(userSession));
        
        document.getElementById('gbName').value = `${user.first_name}${user.last_name ? ' ' + user.last_name : ''}`;
        closeTelegramModal();
        
        // Notify user
        showNotification('✅ Telegram account connected!');
      }
    } else {
      // Fallback: open Telegram in new window or show instruction
      window.open('https://t.me/discoragen_bot', '_blank');
      showNotification('⚠️ Please authorize in the opened window');
    }
  }

  function showNotification(message) {
    const notif = document.createElement('div');
    notif.style.cssText = `
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 45, 77, 0.2);
      border: 1px solid rgba(255, 45, 77, 0.5);
      border-radius: 12px;
      padding: 14px 18px;
      color: #f2e6e8;
      z-index: 10001;
      animation: slideIn 0.3s ease;
    `;
    notif.textContent = message;
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
  }

  // ========== GUESTBOOK ENTRIES ==========
  function sendGuestbookEntry() {
    const name = document.getElementById('gbName').value.trim();
    const message = document.getElementById('gbMessage').value.trim();

    if (!name || !message) {
      showNotification('⚠️ Please fill in all fields');
      return;
    }

    const entry = {
      id: Date.now(),
      name: name,
      message: message,
      timestamp: new Date().toLocaleString(currentLang === 'ru' ? 'ru-RU' : 'en-US'),
      avatar: userSession?.photo_url || '👤'
    };

    let entries = JSON.parse(localStorage.getItem('guestbookEntries') || '[]');
    entries.unshift(entry);
    localStorage.setItem('guestbookEntries', JSON.stringify(entries));

    document.getElementById('gbName').value = userSession ? `${userSession.first_name}${userSession.last_name ? ' ' + userSession.last_name : ''}` : '';
    document.getElementById('gbMessage').value = '';

    renderGuestbookEntries();
    showNotification('✅ Message added to guestbook!');
  }

  function renderGuestbookEntries() {
    const entries = JSON.parse(localStorage.getItem('guestbookEntries') || '[]');
    const container = document.getElementById('gbEntries');
    container.innerHTML = '';

    entries.forEach(entry => {
      const div = document.createElement('div');
      div.className = 'gb-entry';
      div.innerHTML = `
        <div class="gb-entry-name">${entry.name}</div>
        <div class="gb-entry-text">${entry.message}</div>
        <div class="gb-entry-time">${entry.timestamp}</div>
      `;
      container.appendChild(div);
    });
  }

  // ========== INITIALIZATION ==========
  document.addEventListener('DOMContentLoaded', () => {
    // Load user session if exists
    const saved = localStorage.getItem('userSession');
    if (saved) {
      userSession = JSON.parse(saved);
      document.getElementById('gbName').value = `${userSession.first_name}${userSession.last_name ? ' ' + userSession.last_name : ''}`;
    }

    // Initialize language
    setLanguage(currentLang);

    // Initialize theme
    initThemeSystem();

    // Render guestbook
    renderGuestbookEntries();

    // Event listeners
    document.getElementById('langToggle').addEventListener('click', () => {
      const newLang = currentLang === 'ru' ? 'en' : 'ru';
      setLanguage(newLang);
    });

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    // Close modal on background click
    document.getElementById('telegramModal').addEventListener('click', (e) => {
      if (e.target.id === 'telegramModal') closeTelegramModal();
    });

    // Auto-refresh theme at midnight
    const now = new Date();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(0, 0, 0, 0);

    const timeToMidnight = tomorrow - now;
    setTimeout(() => {
      initThemeSystem();
      setInterval(initThemeSystem, 24 * 60 * 60 * 1000);
    }, timeToMidnight);
  });

  // Prevent default modal close on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeTelegramModal();
    }
  });
</script>

</body>
</html>
